name: SDLTouchPoC
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "14.0"

settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: org.example.sdltouchpoc
    TARGETED_DEVICE_FAMILY: "1,2"
    CLANG_C_LANGUAGE_STANDARD: gnu11

targets:
  SDLTouchPoC:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
        excludes:
          - IOSMetalTriangleProbe.h
          - IOSMetalTriangleProbe.mm
          - HPL2MetalMeshAdapter.h
          - HPL2MetalMeshAdapter.cpp
          - HPL2MetalMeshUploader.h
          - HPL2MetalMeshUploader.mm
    info:
      path: Info.plist
    dependencies:
      - framework: Vendor/SDL3.xcframework
        embed: true
    settings:
      base:
        PRODUCT_NAME: SDLTouchPoC

  SDLMetalVisibleTests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/SDLMetalVisibleTests/SDLMetalVisibleTests.m
    dependencies:
      - target: SDLTouchPoC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.sdltouchpoc.uitests
        PRODUCT_NAME: SDLMetalVisibleTests
        TEST_TARGET_NAME: SDLTouchPoC
        GENERATE_INFOPLIST_FILE: YES

  HPL2CRC:
    type: library.static
    platform: iOS
    sources:
      - path: EngineSource/HPL2/core/sources/math/CRC.cpp
    settings:
      base:
        PRODUCT_NAME: HPL2CRC
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/EngineSource/HPL2/core/include"
        CLANG_CXX_LANGUAGE_STANDARD: gnu++11

  HPL2Quaternion:
    type: library.static
    platform: iOS
    sources:
      - path: EngineSource/HPL2/core/sources/math/Quaternion.cpp
    settings:
      base:
        PRODUCT_NAME: HPL2Quaternion
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/EngineSource/HPL2/core/include"
        CLANG_CXX_LANGUAGE_STANDARD: gnu++11

  # Keep this test-only archive local so the bundle linker can dead-strip unused routines.
  HPL2Math:
    type: library.static
    platform: iOS
    sources:
      - path: EngineSource/HPL2/core/sources/math/Math.cpp
      - path: EngineSource/HPL2/core/sources/math/MathTypes.cpp
    settings:
      base:
        PRODUCT_NAME: HPL2Math
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/EngineSource/HPL2/core/include"
        CLANG_CXX_LANGUAGE_STANDARD: gnu++11
        OTHER_CPLUSPLUSFLAGS: "$(inherited) -ffunction-sections -fdata-sections -fvisibility=hidden"

  IOSMetalTriangleProbe:
    type: library.static
    platform: iOS
    sources:
      - path: Sources/IOSMetalTriangleProbe.mm
    settings:
      base:
        PRODUCT_NAME: IOSMetalTriangleProbe
        CLANG_CXX_LANGUAGE_STANDARD: gnu++11
        CLANG_ENABLE_OBJC_ARC: "YES"

  HPL2MetalMeshAdapter:
    type: library.static
    platform: iOS
    sources:
      - path: Sources/HPL2MetalMeshAdapter.cpp
    settings:
      base:
        PRODUCT_NAME: HPL2MetalMeshAdapter
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/EngineSource/HPL2/core/include $(SRCROOT)/Sources"
        CLANG_CXX_LANGUAGE_STANDARD: gnu++11

  HPL2MetalMeshUploader:
    type: library.static
    platform: iOS
    sources:
      - path: Sources/HPL2MetalMeshUploader.mm
    dependencies:
      - target: HPL2MetalMeshAdapter
      - sdk: Metal.framework
      - sdk: Foundation.framework
    settings:
      base:
        PRODUCT_NAME: HPL2MetalMeshUploader
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/EngineSource/HPL2/core/include $(SRCROOT)/Sources"
        CLANG_CXX_LANGUAGE_STANDARD: gnu++11
        CLANG_ENABLE_OBJC_ARC: "YES"

  HPL2CRCTestHost:
    type: application
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/HPL2CRCTestHost/main.m
    info:
      path: Tests/HPL2CRCTestHost/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.hpl2crctesthost
        PRODUCT_NAME: HPL2CRCTestHost

  HPL2CRCTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/HPL2CRCTests/HPL2CRCTests.mm
      - path: Tests/HPL2MetalMeshAdapterTests.mm
      - path: Sources/EngineHostCore.c
      - path: Sources/EngineResourceAccess.c
      - path: Tests/Fixtures/bundle-fixture.txt
        buildPhase: resources
    dependencies:
      - target: HPL2CRC
      - target: HPL2Quaternion
      - target: HPL2Math
      - target: IOSMetalTriangleProbe
      - target: HPL2MetalMeshAdapter
      - target: HPL2MetalMeshUploader
      - target: HPL2CRCTestHost
      - sdk: Metal.framework
      - sdk: Foundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.hpl2crctests
        HEADER_SEARCH_PATHS: "$(inherited) $(SRCROOT)/EngineSource/HPL2/core/include $(SRCROOT)/Sources"
        CLANG_CXX_LANGUAGE_STANDARD: gnu++11
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HPL2CRCTestHost.app/HPL2CRCTestHost"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  SDLTouchPoC:
    build:
      targets:
        SDLTouchPoC: all
  SDLMetalVisible:
    build:
      targets:
        SDLTouchPoC: all
        SDLMetalVisibleTests: [test]
    test:
      targets:
        - SDLMetalVisibleTests
  HPL2CRCSmoke:
    build:
      targets:
        HPL2CRC: all
        HPL2Quaternion: all
        HPL2Math: all
        IOSMetalTriangleProbe: all
        HPL2MetalMeshAdapter: all
        HPL2MetalMeshUploader: all
        HPL2CRCTestHost: all
        HPL2CRCTests: [test]
    test:
      targets:
        - HPL2CRCTests
