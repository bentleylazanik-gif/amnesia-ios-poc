name: SDL3 iOS PoC

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-sdl-poc/**"
      - ".github/workflows/ios-sdl-poc.yml"
  pull_request:
    paths:
      - "ios-sdl-poc/**"
      - ".github/workflows/ios-sdl-poc.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS targets
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch and verify official SDL3 release
        working-directory: ios-sdl-poc
        run: ./scripts/fetch-sdl.sh

      - name: Generate Xcode project
        working-directory: ios-sdl-poc
        run: xcodegen generate --spec project.yml

      - name: Build for iOS devices (unsigned)
        working-directory: ios-sdl-poc
        run: >-
          xcodebuild
          -project SDLTouchPoC.xcodeproj
          -scheme SDLTouchPoC
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath .build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build for iOS Simulator (unsigned)
        working-directory: ios-sdl-poc
        run: >-
          xcodebuild
          -project SDLTouchPoC.xcodeproj
          -scheme SDLTouchPoC
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package unsigned iOS device app as IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="ios-sdl-poc/.build/DerivedData/Build/Products/Debug-iphoneos/SDLTouchPoC.app"
          APP_EXECUTABLE="${APP_PATH}/SDLTouchPoC"
          IPA_PATH="ios-sdl-poc/.build/SDLTouchPoC-unsigned.ipa"
          STAGING_DIR="${RUNNER_TEMP}/SDLTouchPoC-ipa"

          if [[ ! -d "${APP_PATH}" ]]; then
            echo "::error::Missing iOS device app bundle: ${APP_PATH}"
            exit 1
          fi
          if [[ ! -f "${APP_EXECUTABLE}" || ! -x "${APP_EXECUTABLE}" ]]; then
            echo "::error::Missing or non-executable app binary: ${APP_EXECUTABLE}"
            exit 1
          fi

          rm -rf "${STAGING_DIR}"
          mkdir -p "${STAGING_DIR}/Payload" "$(dirname "${IPA_PATH}")"
          ditto "${APP_PATH}" "${STAGING_DIR}/Payload/SDLTouchPoC.app"
          rm -f "${IPA_PATH}"
          (
            cd "${STAGING_DIR}"
            /usr/bin/zip -qry "${GITHUB_WORKSPACE}/${IPA_PATH}" Payload
          )

          CONTENTS_FILE="${RUNNER_TEMP}/SDLTouchPoC-ipa-contents.txt"
          /usr/bin/unzip -Z1 "${IPA_PATH}" > "${CONTENTS_FILE}"
          if ! grep -Fxq "Payload/SDLTouchPoC.app/SDLTouchPoC" "${CONTENTS_FILE}"; then
            echo "::error::Packaged IPA is missing Payload/SDLTouchPoC.app/SDLTouchPoC"
            exit 1
          fi
          if grep -q "Debug-iphonesimulator" "${CONTENTS_FILE}"; then
            echo "::error::Simulator files were unexpectedly included in the IPA"
            exit 1
          fi

      - name: Upload unsigned device IPA
        uses: actions/upload-artifact@v4
        with:
          name: SDLTouchPoC-unsigned-ipa
          path: ios-sdl-poc/.build/SDLTouchPoC-unsigned.ipa
          if-no-files-found: error

      - name: Upload compiled app products
        uses: actions/upload-artifact@v4
        with:
          name: SDLTouchPoC-unsigned-apps
          path: |
            ios-sdl-poc/.build/DerivedData/Build/Products/Debug-iphoneos/SDLTouchPoC.app
            ios-sdl-poc/.build/DerivedData/Build/Products/Debug-iphonesimulator/SDLTouchPoC.app
          if-no-files-found: error
