name: SDL3 iOS PoC

on:
  workflow_dispatch:
  push:
    paths:
      - "ios-sdl-poc/**"
      - ".github/workflows/ios-sdl-poc.yml"
  pull_request:
    paths:
      - "ios-sdl-poc/**"
      - ".github/workflows/ios-sdl-poc.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS targets
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out and stage pinned HPL2 math sources
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_DIR="${RUNNER_TEMP}/amnesia-upstream"
          UPSTREAM_SHA="acc95cdedd6c94db89dc924eb9afa23185df562f"
          UPSTREAM_FILES=(
            HPL2/core/include/graphics/Color.h
            HPL2/core/include/graphics/GraphicsTypes.h
            HPL2/core/include/graphics/VertexBuffer.h
            HPL2/core/include/math/BoundingVolume.h
            HPL2/core/include/math/Frustum.h
            HPL2/core/include/math/CRC.h
            HPL2/core/include/math/Math.h
            HPL2/core/include/math/MathTypes.h
            HPL2/core/include/math/Matrix.h
            HPL2/core/include/math/MeshTypes.h
            HPL2/core/include/math/Quaternion.h
            HPL2/core/include/math/Vector2.h
            HPL2/core/include/math/Vector3.h
            HPL2/core/include/system/Container.h
            HPL2/core/include/system/LowLevelSystem.h
            HPL2/core/include/system/MemoryManager.h
            HPL2/core/include/system/SerializeClass.h
            HPL2/core/include/system/SystemTypes.h
            HPL2/core/sources/math/CRC.cpp
            HPL2/core/sources/math/Math.cpp
            HPL2/core/sources/math/MathTypes.cpp
            HPL2/core/sources/math/Quaternion.cpp
          )

          git clone --filter=blob:none --no-checkout \
            https://github.com/FrictionalGames/AmnesiaTheDarkDescent.git \
            "${UPSTREAM_DIR}"
          git -C "${UPSTREAM_DIR}" sparse-checkout init --no-cone
          git -C "${UPSTREAM_DIR}" sparse-checkout set --no-cone "${UPSTREAM_FILES[@]}"
          git -C "${UPSTREAM_DIR}" checkout --detach "${UPSTREAM_SHA}"

          ACTUAL_SHA="$(git -C "${UPSTREAM_DIR}" rev-parse HEAD)"
          if [[ "${ACTUAL_SHA}" != "${UPSTREAM_SHA}" ]]; then
            echo "::error::Expected upstream ${UPSTREAM_SHA}, checked out ${ACTUAL_SHA}"
            exit 1
          fi

          for relative_path in "${UPSTREAM_FILES[@]}"; do
            if [[ ! -f "${UPSTREAM_DIR}/${relative_path}" ]]; then
              echo "::error::Pinned upstream file is missing: ${relative_path}"
              exit 1
            fi
            destination="ios-sdl-poc/EngineSource/${relative_path}"
            mkdir -p "$(dirname "${destination}")"
            cp "${UPSTREAM_DIR}/${relative_path}" "${destination}"
          done

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch and verify official SDL3 release
        working-directory: ios-sdl-poc
        run: ./scripts/fetch-sdl.sh

      - name: Generate Xcode project
        working-directory: ios-sdl-poc
        run: xcodegen generate --spec project.yml

      - name: Compile HPL2 core-math smoke libraries for iOS device SDK (not a device run)
        working-directory: ios-sdl-poc
        run: >-
          xcodebuild
          -project SDLTouchPoC.xcodeproj
          -scheme HPL2CRCSmoke
          -configuration Debug
          -destination 'generic/platform=iOS'
          -sdk iphoneos
          -derivedDataPath .build/HPL2CRCDevice
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Run HPL2 core-math XCTest on iOS Simulator (not a physical iPhone)
        working-directory: ios-sdl-poc
        shell: bash
        run: |
          set -euo pipefail
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; d=json.load(sys.stdin)["devices"]; print(next((x["udid"] for runtime in sorted(d, reverse=True) for x in d[runtime] if x.get("isAvailable") and x.get("name", "").startswith("iPhone")), ""))')"
          if [[ -z "${SIMULATOR_UDID}" ]]; then
            echo "::error::No available iPhone Simulator device was found on this runner"
            exit 1
          fi
          echo "::notice::Running XCTest on iOS Simulator ${SIMULATOR_UDID}; this is not a physical-device test."
          RESULT_BUNDLE="${RUNNER_TEMP}/HPL2CRCSmoke.xcresult"
          rm -rf "${RESULT_BUNDLE}"
          xcodebuild test \
            -project SDLTouchPoC.xcodeproj \
            -scheme HPL2CRCSmoke \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -derivedDataPath .build/HPL2CRCSimulator \
            -resultBundlePath "${RESULT_BUNDLE}"

      - name: Upload Simulator XCTest result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HPL2CRCSmoke.xcresult
          path: ${{ runner.temp }}/HPL2CRCSmoke.xcresult
          if-no-files-found: warn
          retention-days: 14

      - name: Build for iOS devices (unsigned)
        working-directory: ios-sdl-poc
        run: >-
          xcodebuild
          -project SDLTouchPoC.xcodeproj
          -scheme SDLTouchPoC
          -configuration Debug
          -destination 'generic/platform=iOS'
          -derivedDataPath .build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Build for iOS Simulator (unsigned)
        working-directory: ios-sdl-poc
        run: >-
          xcodebuild
          -project SDLTouchPoC.xcodeproj
          -scheme SDLTouchPoC
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/DerivedData
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Package unsigned iOS device app as IPA
        shell: bash
        run: |
          set -euo pipefail

          APP_PATH="ios-sdl-poc/.build/DerivedData/Build/Products/Debug-iphoneos/SDLTouchPoC.app"
          APP_EXECUTABLE="${APP_PATH}/SDLTouchPoC"
          IPA_PATH="ios-sdl-poc/.build/SDLTouchPoC-unsigned.ipa"
          STAGING_DIR="${RUNNER_TEMP}/SDLTouchPoC-ipa"

          if [[ ! -d "${APP_PATH}" ]]; then
            echo "::error::Missing iOS device app bundle: ${APP_PATH}"
            exit 1
          fi
          if [[ ! -f "${APP_EXECUTABLE}" || ! -x "${APP_EXECUTABLE}" ]]; then
            echo "::error::Missing or non-executable app binary: ${APP_EXECUTABLE}"
            exit 1
          fi

          rm -rf "${STAGING_DIR}"
          mkdir -p "${STAGING_DIR}/Payload" "$(dirname "${IPA_PATH}")"
          ditto "${APP_PATH}" "${STAGING_DIR}/Payload/SDLTouchPoC.app"
          rm -f "${IPA_PATH}"
          (
            cd "${STAGING_DIR}"
            /usr/bin/zip -qry "${GITHUB_WORKSPACE}/${IPA_PATH}" Payload
          )

          /usr/bin/unzip -t "${IPA_PATH}"
          CONTENTS_FILE="${RUNNER_TEMP}/SDLTouchPoC-ipa-contents.txt"
          /usr/bin/unzip -Z1 "${IPA_PATH}" > "${CONTENTS_FILE}"
          if ! grep -Fxq "Payload/SDLTouchPoC.app/" "${CONTENTS_FILE}"; then
            echo "::error::Packaged IPA is missing Payload/SDLTouchPoC.app/"
            exit 1
          fi
          if ! grep -Fxq "Payload/SDLTouchPoC.app/SDLTouchPoC" "${CONTENTS_FILE}"; then
            echo "::error::Packaged IPA is missing Payload/SDLTouchPoC.app/SDLTouchPoC"
            exit 1
          fi
          if grep -q "Debug-iphonesimulator" "${CONTENTS_FILE}"; then
            echo "::error::Simulator files were unexpectedly included in the IPA"
            exit 1
          fi

      - name: Upload unsigned device IPA
        uses: actions/upload-artifact@v4
        with:
          name: SDLTouchPoC-unsigned-ipa
          path: ios-sdl-poc/.build/SDLTouchPoC-unsigned.ipa
          if-no-files-found: error

      - name: Upload compiled app products
        uses: actions/upload-artifact@v4
        with:
          name: SDLTouchPoC-unsigned-apps
          path: |
            ios-sdl-poc/.build/DerivedData/Build/Products/Debug-iphoneos/SDLTouchPoC.app
            ios-sdl-poc/.build/DerivedData/Build/Products/Debug-iphonesimulator/SDLTouchPoC.app
          if-no-files-found: error

  upload-ipa-to-existing-release:
    name: Add IPA to an existing GitHub Release
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download unsigned IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: SDLTouchPoC-unsigned-ipa
          path: release-asset

      - name: Upload to the latest existing release, if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA_PATH="release-asset/SDLTouchPoC-unsigned.ipa"
          if [[ ! -f "${IPA_PATH}" ]]; then
            echo "::error::Downloaded IPA artifact is missing: ${IPA_PATH}"
            exit 1
          fi

          RELEASE_TAG="$(gh release list --repo "${GITHUB_REPOSITORY}" --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "No published release exists; skipping release upload. The Actions artifact remains available."
            exit 0
          fi

          gh release upload "${RELEASE_TAG}" "${IPA_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
